<body class="cs_page">

    <header class="cs_header">
        <a href="index.html" class="cs_back">
            <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
                <path d="M38 20H3M17 5L2 20L17 35" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            Back
        </a>

        <h1 class="cs_title">Cheat Sheets</h1>

        <!-- Filled from CHEATSHEET_CATEGORIES in js/cheatsheets.js -->
        <nav class="cs_tabs" aria-label="Categories"></nav>

        <div class="cs_search" role="search">
            <label for="cs_search_input" class="cs_visually_hidden">Search cheat sheets</label>
            <input type="search" id="cs_search_input" class="cs_search_input"
                   placeholder="ARE YOU LOOKING FOR SOMETHING SPECIFIC?"
                   data-placeholder-phone="LOOKING FOR SOMETHING?"
                   autocomplete="off" spellcheck="false">
            <svg class="cs_search_icon" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
                <circle cx="19" cy="13" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <path d="M12 20L2 30" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
        </div>
    </header>

    <main class="cs_main">
        <!-- Cards are built by js/cheat-sheets-page.js -->
        <div class="cs_grid" id="cs_grid"></div>
        <p class="cs_message" id="cs_message" role="status" hidden></p>

        <!-- Carousels: static cards, one per PDF in files/carousels/.
             Covers are page 1 of each PDF, saved in images/carousels/<name>-cover.png -->
        <section class="carousels" aria-labelledby="carousels_title">
            <h2 class="carousels_title" id="carousels_title">Carousels</h2>
            <div class="carousels_grid">
                <article class="carousel_card">
                    <img src="images/carousels/fonts-cover.webp" alt="Fonts carousel cover" class="carousel_cover" width="1080" height="1080" loading="lazy">
                    <h3 class="h2_regular carousel_title">Fonts</h3>
                    <p class="carousel_count">5 slides</p>
                    <a href="files/carousels/fonts.pdf" class="btn_pill btn_pill_dark carousel_download" target="_blank" rel="noopener noreferrer" download>download PDF</a>
                </article>
                <article class="carousel_card">
                    <img src="images/carousels/just-use-2-fonts-cover.webp" alt="Just use 2 fonts carousel cover" class="carousel_cover" width="1080" height="1350" loading="lazy">
                    <h3 class="h2_regular carousel_title">Just use 2 fonts</h3>
                    <p class="carousel_count">10 slides</p>
                    <a href="files/carousels/just-use-2-fonts.pdf" class="btn_pill btn_pill_dark carousel_download" target="_blank" rel="noopener noreferrer" download>download PDF</a>
                </article>
                <article class="carousel_card">
                    <img src="images/carousels/sans-serif-vs-serif-cover.webp" alt="Sans serif vs serif carousel cover" class="carousel_cover" width="1080" height="1350" loading="lazy">
                    <h3 class="h2_regular carousel_title">Sans serif vs serif</h3>
                    <p class="carousel_count">6 slides</p>
                    <a href="files/carousels/sans-serif-vs-serif.pdf" class="btn_pill btn_pill_dark carousel_download" target="_blank" rel="noopener noreferrer" download>download PDF</a>
                </article>
            </div>
        </section>
    </main>

    <footer class="cs_footer">
        <p class="cs_footer_text">New cheat sheets are coming.<br>Follow me so you don’t miss them</p>
        <div class="cs_footer_links">
            <a href="https://www.threads.com/@dessssssssign" class="btn_outline" target="_blank" rel="noopener">THREADS</a>
            <a href="https://www.instagram.com/made_by_polina/" class="btn_outline" target="_blank" rel="noopener">INSTAGRAM</a>
        </div>
        <p class="cs_footer_made">Made by Polina Gotsina, web designer. <a href="index.html" class="cs_footer_site">Need a website? →</a></p>
    </footer>

    <!-- Slides popup -->
    <dialog class="cs_viewer" aria-labelledby="cs_viewer_title">
        <h2 class="cs_visually_hidden" id="cs_viewer_title"></h2>

        <div class="cs_viewer_bar">
            <div class="cs_viewer_actions">
                <button type="button" class="cs_pill cs_share">
                    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                        <path d="M8 10V1.5M4.5 5L8 1.5L11.5 5M3 8v6.5h10V8" fill="none" stroke="currentColor" stroke-width="1.3"/>
                    </svg>
                    Share
                </button>
                <button type="button" class="cs_pill cs_pdf">
                    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                        <path d="M8 1.5V10M4.5 6.5L8 10L11.5 6.5M2 14.5h12" fill="none" stroke="currentColor" stroke-width="1.3"/>
                    </svg>
                    <span class="cs_pdf_label">Save PDF</span>
                </button>
                <span class="cs_toast" role="status" aria-live="polite"></span>
            </div>
            <span class="cs_counter" aria-live="polite"></span>
            <button type="button" class="cs_close" aria-label="Close">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                    <path d="M1 1L15 15M15 1L1 15" fill="none" stroke="currentColor" stroke-width="1.3"/>
                </svg>
            </button>
        </div>

        <div class="cs_stage">
            <img class="cs_slide" alt="" decoding="async">
            <button type="button" class="cs_arrow cs_arrow_prev" aria-label="Previous slide">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <path d="M22 12H3M10 4L2 12L10 20" fill="none" stroke="currentColor" stroke-width="1.4"/>
                </svg>
            </button>
            <button type="button" class="cs_arrow cs_arrow_next" aria-label="Next slide">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <path d="M2 12H21M14 4L22 12L14 20" fill="none" stroke="currentColor" stroke-width="1.4"/>
                </svg>
            </button>
        </div>

        <div class="cs_thumbs" aria-label="Slides"></div>
    </dialog>

<script src="js/cheatsheets.js"></script>
